[project]
name = "bevel"
version = "0.1.0"
description = "A terminal coding agent for your own models (vLLM, llama.cpp)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bevel contributors" }]
keywords = ["agent", "coding-agent", "tui", "llm", "vllm", "llama-cpp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]

# Runtime dependencies are deliberately capped at three pure-Python packages.
# Adding a compiled dependency here requires justification in CONTRIBUTING.md:
# `uv tool install bevel` must work on Windows and ARM64 with no build step.
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "pygments>=2.18",
]

[project.urls]
Homepage = "https://github.com/thadreber-web/bevel"
Repository = "https://github.com/thadreber-web/bevel"
Issues = "https://github.com/thadreber-web/bevel/issues"

[project.scripts]
bevel = "bevel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bevel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/evals/fixtures"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC",
    "S", "RET", "RSE", "PT", "RUF", "ARG", "PIE", "T20", "PL",
]
ignore = [
    "S101",    # assert in tests is fine, and we use it defensively
    "PLR0913", # many args: our constructors are explicit on purpose
    "PLR2004", # magic values in comparisons
    "E501",    # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "ARG001", "N802", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bevel"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pygments.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a real model endpoint (skips unless one is configured)",
    "slow: slow enough to skip in the fast CI lane",
]
filterwarnings = ["error::DeprecationWarning:bevel.*"]

[tool.coverage.run]
branch = true
source = ["src/bevel"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
